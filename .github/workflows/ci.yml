name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Ensure ffmpeg is on PATH
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null; then
            if [ "$RUNNER_OS" = "Linux" ]; then
              sudo apt-get update && sudo apt-get install -y ffmpeg
            else
              choco install ffmpeg -y
            fi
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1

      # Caption rendering (drawtext fontfile) needs a real font file for the
      # text's script; the suite covers Latin + Devanagari. Windows runners
      # ship Arial/Nirmala; on Linux install DejaVu (Latin) and Noto Core
      # (NotoSansDevanagari-Regular.ttf) so the resolver finds both.
      - name: Install system fonts (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu fonts-noto-core
          fc-list 2>/dev/null | grep -icE "dejavu|devanagari" || true

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Byte-compile (catch syntax errors fast)
        run: python -m compileall -q app.py core

      - name: Run tests
        run: pytest -q
